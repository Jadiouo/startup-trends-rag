name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install python-dotenv pytest
      - run: python -m pytest -q
      - run: python -m py_compile config.py llm.py rag_query.py data_update.py skill_builder.py eval_retrieval.py scripts/crawler.py scripts/check_llm.py
